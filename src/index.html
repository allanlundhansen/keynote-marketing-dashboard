<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marketing Dashboard</title>

    <!-- PrimeIcons -->
    <link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css" />

    <style>
      /* Design Tokens */
      :root {
        --color-primary: #2563EB;
        --color-primary-dark: #1D4ED8;
        --color-success: #10B981;
        --color-warning: #F59E0B;
        --color-error: #EF4444;
        --color-text: #1F2937;
        --color-text-muted: #6B7280;
        --color-bg: #F9FAFB;
        --color-card: #FFFFFF;
        --color-border: #E5E7EB;

        --space-xs: 4px;
        --space-sm: 8px;
        --space-md: 16px;
        --space-lg: 24px;
        --space-xl: 32px;

        --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-size-sm: 12px;
        --font-size-md: 14px;
        --font-size-lg: 16px;
        --font-size-xl: 20px;
        --font-size-2xl: 24px;

        --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
        --shadow-md: 0 4px 6px rgba(0,0,0,0.1);

        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
      }

      * { box-sizing: border-box; }

      body {
        font-family: var(--font-family);
        font-size: var(--font-size-md);
        background-color: var(--color-bg);
        color: var(--color-text);
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }

      .app-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .app-header {
        background: var(--color-card);
        border-bottom: 1px solid var(--color-border);
        padding: var(--space-md) var(--space-lg);
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: var(--shadow-sm);
      }

      .app-header h1 {
        margin: 0;
        font-size: var(--font-size-xl);
        color: var(--color-primary);
      }

      .app-header .data-freshness {
        font-size: var(--font-size-sm);
        color: var(--color-text-muted);
      }

      .app-nav {
        background: var(--color-card);
        border-bottom: 1px solid var(--color-border);
        padding: 0 var(--space-lg);
      }

      .app-nav ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        gap: var(--space-sm);
      }

      .app-nav a {
        display: block;
        padding: var(--space-md);
        color: var(--color-text-muted);
        text-decoration: none;
        border-bottom: 2px solid transparent;
        transition: all 0.2s ease;
      }

      .app-nav a:hover { color: var(--color-primary); }

      .app-nav a.router-link-active {
        color: var(--color-primary);
        border-bottom-color: var(--color-primary);
      }

      .app-main {
        flex: 1;
        padding: var(--space-lg);
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
        overflow-y: auto;
      }

      .main-toolbar {
        margin-bottom: var(--space-lg);
      }

      .card {
        background: var(--color-card);
        border-radius: var(--radius-md);
        padding: var(--space-lg);
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--color-border);
      }

      .loading-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 200px;
        color: var(--color-text-muted);
      }

      .error-container {
        background: #FEF2F2;
        border: 1px solid #FECACA;
        border-radius: var(--radius-md);
        padding: var(--space-lg);
        color: var(--color-error);
      }

      @media (max-width: 768px) {
        .app-header {
          flex-direction: column;
          gap: var(--space-sm);
          text-align: center;
        }
        .app-nav ul {
          flex-wrap: wrap;
          justify-content: center;
        }
        .app-main { padding: var(--space-md); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-container">
        <header class="app-header">
          <h1>Marketing Dashboard</h1>
          <span class="data-freshness">Data as of: {{ dataFreshness }}</span>
        </header>

        <nav class="app-nav">
          <ul>
            <li><router-link to="/overview">Overview</router-link></li>
            <li><router-link to="/trends">Trends</router-link></li>
            <li><router-link to="/campaigns">Campaigns</router-link></li>
            <li><router-link to="/devices">Devices</router-link></li>
            <li><router-link to="/types">Types</router-link></li>
            <li><router-link to="/countries">Countries</router-link></li>
            <li><router-link to="/conversions">Conversions</router-link></li>
          </ul>
        </nav>

        <main class="app-main">
          <div class="main-toolbar">
            <app-sidebar></app-sidebar>
          </div>
          <router-view></router-view>
        </main>
      </div>
    </div>

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <!-- Vue Router -->
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PrimeVue 4 -->
    <script src="https://unpkg.com/primevue/umd/primevue.min.js"></script>
    <script src="https://unpkg.com/@primeuix/themes/umd/aura.js"></script>

    <!-- Store -->
    <?!= include('store') ?>

    <!-- Components -->
    <?!= include('components/DateRangePicker') ?>
    <?!= include('components/CampaignFilter') ?>
    <?!= include('components/DeviceFilter') ?>
    <?!= include('components/CampaignTypeFilter') ?>
    <?!= include('components/MetricCard') ?>
    <?!= include('components/LoadingSpinner') ?>
    <?!= include('components/ErrorMessage') ?>
    <?!= include('components/EmptyState') ?>
    <?!= include('components/AppSidebar') ?>

    <!-- Views -->
    <?!= include('views/OverviewView') ?>
    <?!= include('views/TrendsView') ?>
    <?!= include('views/CampaignsView') ?>
    <?!= include('views/DevicesView') ?>
    <?!= include('views/TypesView') ?>
    <?!= include('views/CountriesView') ?>
    <?!= include('views/ConversionsView') ?>

    <script>
      const routes = [
        { path: '/', redirect: '/overview' },
        { path: '/overview', component: OverviewView, name: 'overview' },
        { path: '/trends', component: TrendsView, name: 'trends' },
        { path: '/campaigns', component: CampaignsView, name: 'campaigns' },
        { path: '/devices', component: DevicesView, name: 'devices' },
        { path: '/types', component: TypesView, name: 'types' },
        { path: '/countries', component: CountriesView, name: 'countries' },
        { path: '/conversions', component: ConversionsView, name: 'conversions' }
      ];

      const router = VueRouter.createRouter({
        history: VueRouter.createWebHashHistory(),
        routes
      });

      const app = Vue.createApp({
        data() {
          return { store, storeActions, storeComputed };
        },
        provide() {
          return { store, storeActions, storeComputed };
        },
        computed: {
          dataFreshness() {
            if (store.ui.isLoading) return 'Loading...';
            if (store.data.lastUpdated) {
              return new Date(store.data.lastUpdated).toLocaleString();
            }
            return 'Unknown';
          }
        },
        async mounted() {
          storeActions.parseUrlToState(this.$route.query);
          try {
            await Promise.all([
              storeActions.loadDashboardData(),
              storeActions.loadCampaignList()
            ]);
            console.log('Dashboard data loaded:', store.data.monthly.length, 'monthly rows');
          } catch (error) {
            console.error('Failed to load initial data:', error);
          }
        }
      });

      // PrimeVue 4 setup - force light mode
      app.use(PrimeVue.Config, {
        theme: {
          preset: PrimeUIX.Themes.Aura,
          options: {
            darkModeSelector: false
          }
        }
      });

      // PrimeVue components
      app.component('DataTable', PrimeVue.DataTable);
      app.component('Column', PrimeVue.Column);
      app.component('Select', PrimeVue.Select);
      app.component('MultiSelect', PrimeVue.MultiSelect);
      app.component('DatePicker', PrimeVue.DatePicker);
      app.component('Card', PrimeVue.Card);
      app.component('Button', PrimeVue.Button);
      app.component('ProgressSpinner', PrimeVue.ProgressSpinner);
      app.component('Skeleton', PrimeVue.Skeleton);
      app.component('Tabs', PrimeVue.Tabs);
      app.component('TabList', PrimeVue.TabList);
      app.component('Tab', PrimeVue.Tab);
      app.component('TabPanels', PrimeVue.TabPanels);
      app.component('TabPanel', PrimeVue.TabPanel);
      app.component('Drawer', PrimeVue.Drawer);
      app.component('ToggleSwitch', PrimeVue.ToggleSwitch);

      // Custom components
      app.component('DateRangePicker', DateRangePicker);
      app.component('CampaignFilter', CampaignFilter);
      app.component('DeviceFilter', DeviceFilter);
      app.component('CampaignTypeFilter', CampaignTypeFilter);
      app.component('MetricCard', MetricCard);
      app.component('LoadingSpinner', LoadingSpinner);
      app.component('ErrorMessage', ErrorMessage);
      app.component('EmptyState', EmptyState);
      app.component('AppSidebar', AppSidebar);

      app.use(router);

      router.beforeEach((to, from, next) => {
        if (to.query && Object.keys(to.query).length > 0) {
          storeActions.parseUrlToState(to.query);
        }
        next();
      });

      app.mount('#app');
    </script>
  </body>
</html>
