          </p>
          <p>Filtered rows: {{ storeComputed.filteredMonthly().length }}</p>
          <p>Engaged Sessions: {{ rawMetrics.engagedSessions }}</p>
          <p>Sessions: {{ rawMetrics.sessions }}</p>
        </div>

  computed: {
    // Raw aggregated metrics from filtered data
    rawMetrics() {
      const data = this.storeComputed.filteredMonthly();
      const conversions = this.storeComputed.totalConversions();
      const cost = data.reduce((sum, r) => sum + (r.Cost || 0), 0);
      const clicks = data.reduce((sum, r) => sum + (r.Clicks || 0), 0);
      const impressions = data.reduce((sum, r) => sum + (r.Impressions || 0), 0);
      const sessions = data.reduce((sum, r) => sum + (r.Sessions || 0), 0);
      const engagedSessions = data.reduce((sum, r) => sum + (r.EngagedSessions || 0), 0);

      return {
        cost,
        clicks,
        impressions,
        sessions,
        engagedSessions,
        conversions
      };
    },

    // Primary KPIs: Cost, Clicks, Avg CPC, Engagement Rate
    primaryMetrics() {
      const { cost, clicks, sessions, engagedSessions } = this.rawMetrics;
      return {
        cost,
        clicks,
        avgCPC: clicks > 0 ? cost / clicks : 0,
        engagementRate: sessions > 0 ? engagedSessions / sessions : 0
      };
    },

    // Comparison raw metrics
    comparisonRawMetrics() {
      const range = this.storeComputed.comparisonDateRange();
      if (!range) return null;

      const data = this.store.data.monthly.filter(row => {
        if (row.YearMonth < range.from || row.YearMonth > range.to) return false;
        if (this.store.filters.campaigns.length > 0) {
          if (!this.store.filters.campaigns.includes(String(row.CampaignId))) return false;
        }
        if (this.store.filters.devices.length > 0) {
          if (!this.store.filters.devices.includes(row.Device)) return false;
        }
        if (this.store.filters.campaignTypes.length > 0) {
          if (!this.store.filters.campaignTypes.includes(row.CampaignType)) return false;
        }
        return true;
      });

      // Comparison conversions from events
      const events = this.store.data.events.filter(row => {
        if (row.YearMonth < range.from || row.YearMonth > range.to) return false;
        if (this.store.filters.campaigns.length > 0) {
          if (!this.store.filters.campaigns.includes(String(row.CampaignId))) return false;
        }
        if (this.store.filters.devices.length > 0) {
          if (!this.store.filters.devices.includes(row.Device)) return false;
        }
        if (!this.store.conversions.selectedEvents.includes(row.EventName)) return false;
        return true;
      });

      return {
        cost: data.reduce((sum, r) => sum + (r.Cost || 0), 0),
        clicks: data.reduce((sum, r) => sum + (r.Clicks || 0), 0),
        impressions: data.reduce((sum, r) => sum + (r.Impressions || 0), 0),
        sessions: data.reduce((sum, r) => sum + (r.Sessions || 0), 0),
        engagedSessions: data.reduce((sum, r) => sum + (r.EngagedSessions || 0), 0),
        conversions: events.reduce((sum, r) => sum + (r.EventCount || 0), 0)
      };
    },

    // Comparison Primary KPIs
    comparisonPrimaryMetrics() {
      const raw = this.comparisonRawMetrics;
      if (!raw) return null;

      const { cost, clicks, sessions, engagedSessions } = raw;
      return {
        cost,
        clicks,
        avgCPC: clicks > 0 ? cost / clicks : 0,
        engagementRate: sessions > 0 ? engagedSessions / sessions : 0
      };
    },

    // Supporting Metrics: Impressions, CTR, Sessions, Engaged Sessions, Cost/Session, Cost/Engaged Session
    supportingMetrics() {
      const { cost, clicks, impressions, sessions, engagedSessions } = this.rawMetrics;
      return {
        impressions,
        ctr: impressions > 0 ? clicks / impressions : 0,
        sessions,
        engagedSessions,
        costPerSession: sessions > 0 ? cost / sessions : 0,
        costPerEngagedSession: engagedSessions > 0 ? cost / engagedSessions : 0
      };
    },

    // Comparison Supporting Metrics
    comparisonSupportingMetrics() {
      const raw = this.comparisonRawMetrics;
      if (!raw) return null;

      const { cost, clicks, impressions, sessions, engagedSessions } = raw;
      return {
        impressions,
        ctr: impressions > 0 ? clicks / impressions : 0,
        sessions,
        engagedSessions,
        costPerSession: sessions > 0 ? cost / sessions : 0,
        costPerEngagedSession: engagedSessions > 0 ? cost / engagedSessions : 0
      };
    },

    // Funnel stages with values, rates, and flex sizing
    funnelStages() {
      const { impressions, clicks, sessions, engagedSessions, conversions } = this.rawMetrics;

      // Calculate rates (conversion from previous stage)
      const ctr = impressions > 0 ? clicks / impressions : 0;
      const clickToSession = clicks > 0 ? sessions / clicks : 0;
      const sessionToEngaged = sessions > 0 ? engagedSessions / sessions : 0;
      const engagedToConversion = engagedSessions > 0 ? conversions / engagedSessions : 0;

      // Calculate flex values relative to previous stage
      // Each stage is sized based on its conversion rate from previous
      // Formula: flex = previous_flex * (0.3 + 0.7 * rate) - min 30% of previous
      // With a minimum floor of 0.25 so text always fits
      const minFlex = 0.25;
      const relativeFlex = (prevFlex, rate) => Math.max(minFlex, prevFlex * (0.3 + 0.7 * Math.min(rate, 1)));

      const impressionsFlex = 1;
      const clicksFlex = relativeFlex(impressionsFlex, ctr);
      const sessionsFlex = relativeFlex(clicksFlex, clickToSession);
      const engagedFlex = relativeFlex(sessionsFlex, sessionToEngaged);
      const conversionsFlex = relativeFlex(engagedFlex, engagedToConversion);

      return {
        impressions: {
          value: impressions,
          flex: impressionsFlex,
          rate: null // No rate for first stage
        },
        clicks: {
          value: clicks,
          flex: clicksFlex,
          rate: ctr
        },
        sessions: {
          value: sessions,
          flex: sessionsFlex,
          rate: clickToSession
        },
        engaged: {
          value: engagedSessions,
          flex: engagedFlex,
          rate: sessionToEngaged
        },
        conversions: {
          value: conversions,
          flex: conversionsFlex,
          rate: engagedToConversion
        }
      };
    },

    // Comparison funnel stages
    comparisonFunnelStages() {
      const raw = this.comparisonRawMetrics;
      if (!raw) return null;

      const { impressions, clicks, sessions, engagedSessions, conversions } = raw;

      const ctr = impressions > 0 ? clicks / impressions : 0;
      const clickToSession = clicks > 0 ? sessions / clicks : 0;
      const sessionToEngaged = sessions > 0 ? engagedSessions / sessions : 0;
      const engagedToConversion = engagedSessions > 0 ? conversions / engagedSessions : 0;

      return {
        impressions: { value: impressions, rate: null },
        clicks: { value: clicks, rate: ctr },
        sessions: { value: sessions, rate: clickToSession },
        engaged: { value: engagedSessions, rate: sessionToEngaged },
        conversions: { value: conversions, rate: engagedToConversion }
      };
    },

    // Whether to show comparison data in funnel
    funnelComparison() {
      return this.comparisonFunnelStages !== null;
    },

    // Whether comparison mode is enabled (for Quick Insights)
    hasComparison() {
      return this.store.dateRange.comparisonMode !== 'none';
    },

    // Label for comparison period in Quick Insights
    comparisonPeriodLabel() {
      const mode = this.store.dateRange.comparisonMode;
      if (mode === 'lastYear') return 'Last Year';
      if (mode === 'previous') return 'Previous Period';
      if (mode === 'custom') {
        const range = this.storeComputed.comparisonDateRange();
        if (range) return `${range.from} to ${range.to}`;
        return 'Comparison Period';
      }
      return 'Comparison Period';
    },

    // Trend chart title based on selected preset
    trendChartTitle() {
      const titles = {
        'cost_clicks': 'Cost & Clicks Trend',
        'cost_sessions': 'Cost & Sessions Trend',
        'sessions_engaged': 'Sessions & Engaged Trend',
        'clicks_impressions': 'Clicks & Impressions Trend'
      };
      return titles[this.selectedMetricPreset] || 'Trend';
    },

    // Metric configuration for each preset
    metricConfig() {
      const configs = {
        'cost_clicks': {
          primary: { key: 'Cost', label: 'Cost', color: '#2563EB', format: 'currency' },
          secondary: { key: 'Clicks', label: 'Clicks', color: '#10B981', format: 'number' }
        },
        'cost_sessions': {
          primary: { key: 'Cost', label: 'Cost', color: '#2563EB', format: 'currency' },
          secondary: { key: 'Sessions', label: 'Sessions', color: '#8B5CF6', format: 'number' }
        },
        'sessions_engaged': {
          primary: { key: 'Sessions', label: 'Sessions', color: '#8B5CF6', format: 'number' },
          secondary: { key: 'EngagedSessions', label: 'Engaged', color: '#14B8A6', format: 'number' }
        },
        'clicks_impressions': {
          primary: { key: 'Clicks', label: 'Clicks', color: '#10B981', format: 'number' },
          secondary: { key: 'Impressions', label: 'Impressions', color: '#F59E0B', format: 'number' }
        }
      };
      return configs[this.selectedMetricPreset] || configs['cost_clicks'];
    },

    // Trend chart data - based on selected metric preset
    trendChartData() {
      const monthly = this.storeComputed.filteredMonthly();
      const config = this.metricConfig;

      // Group by YearMonth
      const byMonth = {};
      monthly.forEach(row => {
        if (!byMonth[row.YearMonth]) {
          byMonth[row.YearMonth] = { primary: 0, secondary: 0 };
        }
        byMonth[row.YearMonth].primary += row[config.primary.key] || 0;
        byMonth[row.YearMonth].secondary += row[config.secondary.key] || 0;
      });

      // Sort by month and extract arrays
      const sortedMonths = Object.keys(byMonth).sort();
      return {
        labels: sortedMonths.map((m, i) => `M${i + 1}`),
        actualLabels: sortedMonths,
        primary: sortedMonths.map(m => byMonth[m].primary),
        secondary: sortedMonths.map(m => byMonth[m].secondary)
      };
    },

    // Comparison trend chart data - aligned to current data's months
    comparisonTrendChartData() {
      const mode = this.store.dateRange.comparisonMode;
      if (mode === 'none') return null;

      const currentData = this.trendChartData;
      if (!currentData || !currentData.actualLabels.length) return null;

      // Helper to calculate comparison month for a given current month
      const getComparisonMonth = (currentYM) => {
        const d = new Date(currentYM + '-01');
        if (mode === 'lastYear') {
          d.setFullYear(d.getFullYear() - 1);
        } else if (mode === 'previous') {
          const fromParts = this.store.dateRange.from.split('-').map(Number);
          const toParts = this.store.dateRange.to.split('-').map(Number);
          const monthsInRange = (toParts[0] - fromParts[0]) * 12 + (toParts[1] - fromParts[1]) + 1;
          d.setMonth(d.getMonth() - monthsInRange);
        } else if (mode === 'custom') {
          // Calculate offset between current from and comparison from
          const currentFrom = this.store.dateRange.from.split('-').map(Number);
          const compFrom = this.store.dateRange.compareFrom.split('-').map(Number);
          const monthOffset = (currentFrom[0] - compFrom[0]) * 12 + (currentFrom[1] - compFrom[1]);
          d.setMonth(d.getMonth() - monthOffset);
        }
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      };

      // Build lookup of all comparison period data
      const monthly = this.store.data.monthly.filter(row => {
        if (this.store.filters.campaigns.length > 0) {
          if (!this.store.filters.campaigns.includes(String(row.CampaignId))) return false;
        }
        if (this.store.filters.devices.length > 0) {
          if (!this.store.filters.devices.includes(row.Device)) return false;
        }
        if (this.store.filters.campaignTypes.length > 0) {
          if (!this.store.filters.campaignTypes.includes(row.CampaignType)) return false;
        }
        return true;
      });

      const config = this.metricConfig;
      const byMonth = {};
      monthly.forEach(row => {
        const ym = this.normalizeYearMonth(row.YearMonth);
        if (!byMonth[ym]) {
          byMonth[ym] = { primary: 0, secondary: 0 };
        }
        byMonth[ym].primary += row[config.primary.key] || 0;
        byMonth[ym].secondary += row[config.secondary.key] || 0;
      });

      // Build aligned arrays: for each current month, get the corresponding comparison month's data
      const compLabels = [];
      const compPrimary = [];
      const compSecondary = [];

      currentData.actualLabels.forEach(currentYM => {
        const normalizedCurrentYM = this.normalizeYearMonth(currentYM);
        const compYM = getComparisonMonth(normalizedCurrentYM);
        compLabels.push(compYM);
        const data = byMonth[compYM] || { primary: 0, secondary: 0 };
        compPrimary.push(data.primary);
        compSecondary.push(data.secondary);
      });

      return {
        labels: compLabels,
        primary: compPrimary,
        secondary: compSecondary
      };
    }
  },

  mounted() {
    this.$nextTick(() => {
      this.createTrendChart();
      // Lazy-load keywords after main render
      this.loadKeywords();
    });
  },

  watch: {
    trendChartData: {
      handler() {
        this.$nextTick(() => {
          this.createTrendChart();
        });
      },
      deep: true
    },
    comparisonTrendChartData: {
      handler() {
        this.$nextTick(() => {
          this.createTrendChart();
        });
      },
      deep: true
    },
    // Reload keywords when date range changes
    'store.dateRange.from': function() {
      this.loadKeywords();
    },
    'store.dateRange.to': function() {
      this.loadKeywords();
    },
    'store.dateRange.comparisonMode': function() {
      this.loadKeywords();
    },
    'store.filters.campaigns': {
      handler() {
        this.loadKeywords();
      },
      deep: true
    },
    // Load keywords when main data becomes available
    'store.ui.initialized': function(newVal) {
      if (newVal) {
        this.loadKeywords();
      }
    }
  },

  methods: {
    // Helper to normalize YearMonth (handles both "YYYY-MM" and ISO date strings)
    // Uses UTC to avoid timezone issues with end-of-month dates
    normalizeYearMonth(ym) {
      if (!ym) return null;
      // If it's already YYYY-MM format
      if (typeof ym === 'string' && /^\d{4}-\d{2}$/.test(ym)) return ym;
      // If it's an ISO date string or Date object, use UTC to avoid timezone rollover
      const d = new Date(ym);
      if (isNaN(d.getTime())) return null;
      return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
    },

    retry() {
      this.storeActions.loadDashboardData();
    },

    formatNumber(value) {
      if (value === null || value === undefined) return '—';
      return new Intl.NumberFormat('en-US').format(Math.round(value));
    },

    formatPercent(value) {
      if (value === null || value === undefined) return '—';
      return (value * 100).toFixed(1) + '%';
    },

    formatRateChange(current, previous) {
      if (current === null || previous === null || previous === undefined || previous === 0) return '';
      const pctChange = ((current - previous) / previous) * 100;
      const sign = pctChange >= 0 ? '▲' : '▼';
      return `${sign} ${Math.abs(pctChange).toFixed(1)}%`;
    },

    getRateChangeClass(current, previous) {
      if (current === null || previous === null || previous === undefined) return '';
      const diff = current - previous;
      if (diff > 0.001) return 'change-up';
      if (diff < -0.001) return 'change-down';
      return 'change-neutral';
    },

    formatValueChange(current, previous) {
      if (current === null || previous === null || previous === undefined || previous === 0) return '';
      const pctChange = ((current - previous) / previous) * 100;
      const sign = pctChange >= 0 ? '▲' : '▼';
      return `${sign} ${Math.abs(pctChange).toFixed(1)}%`;
    },

    getValueChangeClass(current, previous) {
      if (current === null || previous === null || previous === undefined || previous === 0) return '';
      const diff = current - previous;
      if (diff > 0) return 'change-up';
      if (diff < 0) return 'change-down';
      return 'change-neutral';
    },

    createTrendChart() {
      const canvas = this.$refs.trendChart;
      if (!canvas) {
        console.log('createTrendChart: canvas not found');
        return;
      }

      // Destroy any existing chart on this canvas
      const existingChart = Chart.getChart(canvas);
      if (existingChart) {
        existingChart.destroy();
      }
      this.trendChartInstance = null;

      const currentData = this.trendChartData;
      const comparisonData = this.comparisonTrendChartData;
      const config = this.metricConfig;

      // Determine comparison label based on mode
      const comparisonLabel = this.store.dateRange.comparisonMode === 'lastYear' ? 'Last Year' : 'Previous';
      const hasComparison = !!comparisonData;

      // Format value based on metric type
      const formatValue = (value, format) => {
        if (format === 'currency') return '$' + value.toLocaleString();
        return value.toLocaleString();
      };

      const datasets = [
        {
          label: hasComparison ? `${config.primary.label} (Current)` : config.primary.label,
          data: currentData.primary,
          borderColor: config.primary.color,
          backgroundColor: config.primary.color + '1A', // 10% opacity
          borderWidth: 2,
          tension: 0.3,
          yAxisID: 'y',
          pointRadius: 3,
          pointHoverRadius: 5
        },
        {
          label: hasComparison ? `${config.secondary.label} (Current)` : config.secondary.label,
          data: currentData.secondary,
          borderColor: config.secondary.color,
          backgroundColor: config.secondary.color + '1A', // 10% opacity
          borderWidth: 2,
          tension: 0.3,
          yAxisID: 'y1',
          pointRadius: 3,
          pointHoverRadius: 5
        }
      ];

      // Add comparison datasets if comparison mode is enabled
      if (comparisonData) {
        datasets.push({
          label: `${config.primary.label} (${comparisonLabel})`,
          data: comparisonData.primary,
          borderColor: config.primary.color,
          backgroundColor: 'transparent',
          borderWidth: 2,
          borderDash: [5, 5],
          tension: 0.3,
          yAxisID: 'y',
          pointRadius: 3,
          pointHoverRadius: 5,
          pointStyle: 'rectRot',
          pointBorderColor: config.primary.color,
          pointBackgroundColor: 'transparent'
        });
        datasets.push({
          label: `${config.secondary.label} (${comparisonLabel})`,
          data: comparisonData.secondary,
          borderColor: config.secondary.color,
          backgroundColor: 'transparent',
          borderWidth: 2,
          borderDash: [5, 5],
          tension: 0.3,
          yAxisID: 'y1',
          pointRadius: 3,
          pointHoverRadius: 5,
          pointStyle: 'rectRot',
          pointBorderColor: config.secondary.color,
          pointBackgroundColor: 'transparent'
        });
      }

      try {
        this.trendChartInstance = new Chart(canvas, {
          type: 'line',
          data: {
            labels: currentData.labels,
            datasets: datasets
          },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                usePointStyle: true,
                padding: 20
              }
            },
            tooltip: {
              usePointStyle: true,
              callbacks: {
                title: (items) => {
                  const idx = items[0].dataIndex;
                  // Format as YYYY-MM using UTC to avoid timezone issues
                  const formatYM = (d) => {
                    if (!d) return '';
                    if (/^\d{4}-\d{2}$/.test(d)) return d;
                    const date = new Date(d);
                    if (isNaN(date.getTime())) return d;
                    return `${date.getUTCFullYear()}-${String(date.getUTCMonth() + 1).padStart(2, '0')}`;
                  };
                  const currentDate = formatYM(currentData.actualLabels[idx]);
                  if (comparisonData && comparisonData.labels[idx]) {
                    const compDate = formatYM(comparisonData.labels[idx]);
                    return `${currentDate} vs ${compDate}`;
                  }
                  return currentDate;
                },
                label: (context) => {
                  const label = context.dataset.label;
                  const value = context.parsed.y;
                  // Check if this is a primary or secondary metric by label
                  const isPrimary = label.includes(config.primary.label);
                  const format = isPrimary ? config.primary.format : config.secondary.format;
                  return `${label}: ${formatValue(value, format)}`;
                }
              }
            }
          },
          scales: {
            x: {
              grid: {
                display: false
              }
            },
            y: {
              type: 'linear',
              display: true,
              position: 'left',
              title: {
                display: true,
                text: config.primary.format === 'currency' ? `${config.primary.label} ($)` : config.primary.label
              },
              ticks: {
                callback: (value) => config.primary.format === 'currency' ? '$' + value.toLocaleString() : value.toLocaleString()
              }
            },
            y1: {
              type: 'linear',
              display: true,
              position: 'right',
              title: {
                display: true,
                text: config.secondary.label
              },
              grid: {
                drawOnChartArea: false
              },
              ticks: {
                callback: (value) => config.secondary.format === 'currency' ? '$' + value.toLocaleString() : value.toLocaleString()
              }
            }
          }
        }
        });
      } catch (err) {
        console.error('createTrendChart error:', err);
      }
    },

    // Load keywords data (lazy-loaded)
    loadKeywords() {
      // Don't load if main data isn't ready yet
      if (!this.store.ui.initialized) {
        console.log('loadKeywords: waiting for main data');
        return;
      }

      this.keywordsLoading = true;
      this.keywordsError = null;

      // Get date range
      const dateFrom = this.store.dateRange.from;
      const dateTo = this.store.dateRange.to;

      // Get comparison date range if enabled
      const compRange = this.storeComputed.comparisonDateRange();
      const compareDateFrom = compRange?.from || null;
      const compareDateTo = compRange?.to || null;

      // Get campaign filter
      const campaignIds = this.store.filters.campaigns.length > 0 ? this.store.filters.campaigns : null;

      console.log('loadKeywords:', { dateFrom, dateTo, compareDateFrom, compareDateTo, campaignIds });

      google.script.run
        .withSuccessHandler((result) => {
          console.log('getKeywordsSummary result:', result);
          this.keywordsData = result;
          this.keywordsLoading = false;
          // Reset expanded state
          this.expandedCostRows = [];
          this.expandedClicksRows = [];
          this.expandedCompCostRows = [];
          this.expandedCompClicksRows = [];
        })
        .withFailureHandler((error) => {
          console.error('getKeywordsSummary error:', error);
          this.keywordsError = error.message || 'Failed to load keyword data';
          this.keywordsLoading = false;
        })
        .getKeywordsSummary(dateFrom, dateTo, compareDateFrom, compareDateTo, campaignIds, 5);
    },

    // Format currency
    formatCurrency(value) {
      if (value === null || value === undefined) return '—';
      return '$' + new Intl.NumberFormat('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(value);
    },

    // Format change percentage
    formatChange(value) {
      if (value === null || value === undefined) return '—';
      const sign = value >= 0 ? '▲' : '▼';
      return `${sign} ${Math.abs(value).toFixed(1)}%`;
    },

    // Get CSS class for cost change (cost increase is bad)
    getCostChangeClass(value) {
      if (value === null || value === undefined) return '';
      if (value > 0) return 'change-down'; // Cost up = bad
      if (value < 0) return 'change-up';   // Cost down = good
      return 'change-neutral';
    },

    // Get CSS class for clicks change (clicks increase is good)
    getClicksChangeClass(value) {
      if (value === null || value === undefined) return '';
      if (value > 0) return 'change-up';   // Clicks up = good
      if (value < 0) return 'change-down'; // Clicks down = bad
      return 'change-neutral';
    }
  }
};
</script>
